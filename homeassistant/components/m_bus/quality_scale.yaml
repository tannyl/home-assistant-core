rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not register custom actions.
  appropriate-polling:
    status: exempt
    comment: Integration uses M-Bus protocol polling which is appropriate for meter reading devices.
  brands:
    status: exempt
    comment: Integration does not support specific device brands yet.
  common-modules:
    status: exempt
    comment: Integration does not share code with other integrations yet.
  config-flow-test-coverage:
    status: exempt
    comment: Test coverage will be added when integration is fully implemented.
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No custom actions to document.
  docs-high-level-description:
    status: exempt
    comment: Documentation will be created when integration is ready for public use.
  docs-installation-instructions:
    status: exempt
    comment: Documentation will be created when integration is ready for public use.
  docs-removal-instructions:
    status: exempt
    comment: Documentation will be created when integration is ready for public use.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: exempt
    comment: Integration currently stores minimal data in config entry, runtime_data will be added when API client is implemented.
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: Integration performs connection test in config flow before setup.
  unique-config-entry: done

  # Silver
  action-exceptions: todo
  config-entry-unloading: todo
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: todo
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: todo
  diagnostics: todo
  discovery-update-info: todo
  discovery: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
